<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>etl+</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preload" href="assets/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/phosphor.css">
  <link rel="stylesheet" href="app.css">
  <script>
    (function () {
      let t = null;
      const q = new URLSearchParams(location.search).get("theme");
      if (q === "light" || q === "dark") t = q;
      else { try { t = localStorage.getItem("etlplus-theme"); } catch (e) { /* private mode */ } }
      if (t) document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="shell bare" id="shell">
    <aside class="side">
      <a class="brand" href="#/overview" aria-label="etl+ overview">
        <img src="assets/crane-128.png" alt="">
        <div>
          <div class="name">etl+</div>
          <div class="by">Crested Crane Intelligence</div>
        </div>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/overview" data-page="overview"><i class="ph ph-squares-four" aria-hidden="true"></i><span>Overview</span></a>
        <div class="grp">Build</div>
        <a href="#/sources" data-page="sources"><i class="ph ph-plugs" aria-hidden="true"></i><span>Sources</span></a>
        <a href="#/destinations" data-page="destinations"><i class="ph ph-database" aria-hidden="true"></i><span>Destinations</span></a>
        <a href="#/jobs" data-page="jobs"><i class="ph ph-flow-arrow" aria-hidden="true"></i><span>Jobs</span></a>
        <div class="grp">Operate</div>
        <a href="#/runs" data-page="runs"><i class="ph ph-clock-counter-clockwise" aria-hidden="true"></i><span>Runs</span></a>
        <a href="#/stage" data-page="stage"><i class="ph ph-stack" aria-hidden="true"></i><span>Stage</span></a>
        <div class="grp">Setup</div>
        <a href="#/layouts" data-page="layouts"><i class="ph ph-rows" aria-hidden="true"></i><span>Layouts</span></a>
        <a href="#/settings" data-page="settings"><i class="ph ph-gear-six" aria-hidden="true"></i><span>Settings</span></a>
      </nav>
      <div class="side-foot">
        <div id="running"></div>
        <div class="client">
          <div class="grow">
            <a class="cname" id="project-name" href="#/settings">Project</a>
            <div class="csub" id="project-sub"></div>
          </div>
          <button class="btn ghost icon" id="theme" aria-label="Switch light or dark"><i class="ph ph-sun" aria-hidden="true"></i></button>
        </div>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="top">
        <label class="search" id="search">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <span class="sr">Find a job or source</span>
          <input type="search" id="search-q" placeholder="Find a job or source" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="jump">
          <span class="kbd" aria-hidden="true">/</span>
        </label>
        <div class="topr">
          <a id="project-badge" class="badge proj hidden" href="#/settings"></a>
        </div>
      </div>
      <div class="page" id="page" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
